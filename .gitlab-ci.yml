variables:
  compare_branch: dev-v0.2.0
  GIT_DEPTH: 0
  kivy_stubs_repo: https://github.com/ScarlettSamantha/python-kivy-stubs.git
  panda3d_stubs_repo: https://github.com/WMOkiishi/types-panda3d.git
  direct_stubs_repo: https://git.scarlettbytes.nl/scarlett/direct-stubs.git

stages:
  - verify
  - package

.default-python-job-base: &default-python-job-base
  image: python:3.13
  cache:
    key: shared-pip-cache
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - pip config set global.cache-dir .cache/pip
    - pip install --upgrade pip --root-user-action=ignore
    - pip install -r requirements.txt --root-user-action=ignore
    - git clone --depth 1 $panda3d_stubs_repo stubs/panda3d
    - git clone --depth 1 $kivy_stubs_repo   stubs/kivy
    - git clone --depth 1 $direct_stubs_repo stubs/direct


.default-python-job: &default-python-job
  <<: *default-python-job-base
  only:
    - branches
    - merge_requests
  
pyright-full-check:
  <<: *default-python-job
  stage: verify
  allow_failure: true
  only:
    - merge_requests
  script:
    - pip install pyright --root-user-action=ignore
    - pyright . -p pyrightconfig.json

pyright-diff-check:
  <<: *default-python-job
  stage: verify
  except:
    - merge_requests
  script:
    - pip install pyright --root-user-action=ignore
    - git fetch origin $compare_branch
    - |
      changed_files=$(git diff --diff-filter=ACMR --name-only origin/$compare_branch...HEAD -- '*.py')
      if [ -n "$changed_files" ]; then
        echo "Changed Python files:"
        echo "$changed_files"
        pyright $changed_files -p pyrightconfig.json
      else
        echo "No Python files changed. Skipping pyright."
      fi

block-bad-imports:
  image: python:3.13
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  before_script: []
  script:
    - python3 scripts/check_bad_imports.py

lint-check:
  <<: *default-python-job
  stage: verify
  script:
    - pip install ruff --root-user-action=ignore
    - ruff check .

format-check:
  <<: *default-python-job
  stage: verify
  script:
    - pip install ruff --root-user-action=ignore
    - ruff format --check --diff .

security-check:
  <<: *default-python-job
  stage: verify
  script:
    - pip install bandit --root-user-action=ignore
    - bandit -r . -c pyproject.toml

markdown-check:
  <<: *default-python-job
  stage: verify
  only:
    - branches
    - merge_requests
  script:
    - pymarkdownlnt --config .markdownlnt.json scan '**/*.md'

docs-index-check:
  image: python:3.13
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  before_script: []
  script:
    - python3 scripts/generate_project_index.py --check

check-isdev-flag:
  <<: *default-python-job-base
  stage: verify
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^dev-.*$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  script:
    - scripts/check_isdev.py

package-linux:
  image: ubuntu:24.04
  stage: package
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^dev-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
      when: manual
    - when: never
  needs:
    - job: check-isdev-flag
      artifacts: false
      optional: true
    - job: pyright-full-check
      artifacts: false
      optional: true
  variables:
    DEBIAN_FRONTEND: noninteractive
    PYTHONUNBUFFERED: 1
  cache:
    key: shared-pip-cache
    paths: [ .cache/pip ]
    policy: pull-push
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends software-properties-common curl git build-essential python3-dev
    - add-apt-repository ppa:deadsnakes/ppa -y
    - apt-get update -qq
    - apt-get install -y --no-install-recommends python3.13 python3.13-dev
    - curl -sS https://bootstrap.pypa.io/get-pip.py | python3.13
    - update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.13 1
    - pip3 install --upgrade pip --root-user-action=ignore
    - pip3 install -r requirements.txt --root-user-action=ignore
  tags: [linux]
  script:
    - python3 --version
    - ln -sf /usr/local/bin/python3.13 /usr/bin/python3
    - pip install briefcase --root-user-action=ignore
    - /usr/bin/python3.13 -m briefcase create linux
    - /usr/bin/python3.13 -m briefcase update -r
    - /usr/bin/python3.13 -m briefcase update
    - /usr/bin/python3.13 -m briefcase build linux
    - /usr/bin/python3.13 -m briefcase package linux
    - mkdir -p builds
    - cp dist/*.deb builds/
  artifacts:
    paths: [ builds/*.deb ]
    expire_in: 1 week

package-windows:
  rules:
      - if: '$CI_COMMIT_TAG'
        when: on_success
      - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
        when: manual
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^dev-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
        when: manual
      - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
        when: manual
      - when: never
  stage: package
  tags: [windows]
  needs:
    - job: check-isdev-flag
      artifacts: false
      optional: true
    - job: pyright-full-check
      artifacts: false
      optional: true
  variables:
    PYTHONUNBUFFERED: "1"
    PY_PYTHON: "3.13"
  before_script:
    - |
      if ($PROFILE -and ($PROFILE | Get-Member -Name AllUsersAllHosts -ErrorAction SilentlyContinue)) {
        foreach ($p in @(
          $PROFILE.AllUsersAllHosts,
          $PROFILE.CurrentUserAllHosts,
          $PROFILE.AllUsersCurrentHost,
          $PROFILE.CurrentUserCurrentHost
        )) { if ($p -and (Test-Path $p)) { . $p } }
      }
    - |
      $mach=[Environment]::GetEnvironmentVariable('Path','Machine')
      $user=[Environment]::GetEnvironmentVariable('Path','User')
      $cur=$env:Path
      $paths = ((($mach,$user,$cur) -join ';') -split ';') |
        ForEach-Object { $_.Trim() } |
        Where-Object { $_ -and (Test-Path $_) }
      $env:Path = [string]::Join(';', ($paths | Select-Object -Unique))
    - '$PSVersionTable'
    - 'Get-Command git -ErrorAction SilentlyContinue'
    - |
      if (-not (Get-Command py -ErrorAction SilentlyContinue)) {
        if (Get-Command winget -ErrorAction SilentlyContinue) {
          winget install -e --id Python.Python.3.13 --silent
        } elseif (Get-Command choco -ErrorAction SilentlyContinue) {
          choco install -y python --version=3.13.0
        } else {
          Write-Error "No Python launcher found and neither winget nor choco available."
        }
      }
    - 'Get-Command py -ErrorAction SilentlyContinue'
    - 'py -m pip install --upgrade pip'
    - 'py -m pip install -r requirements.txt'
    - 'py -m pip install -U pip briefcase'
  script:
    - |
      if ($PROFILE -and ($PROFILE | Get-Member -Name AllUsersAllHosts -ErrorAction SilentlyContinue)) {
        foreach ($p in @(
          $PROFILE.AllUsersAllHosts,
          $PROFILE.CurrentUserAllHosts,
          $PROFILE.AllUsersCurrentHost,
          $PROFILE.CurrentUserCurrentHost
        )) { if ($p -and (Test-Path $p)) { . $p } }
      }
    - 'py scripts/build_windows.py'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - 'dist/**'