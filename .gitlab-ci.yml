variables:
  compare_branch: dev-v0.2.0
  GIT_DEPTH: 0
  kivy_stubs_repo: https://github.com/ScarlettSamantha/python-kivy-stubs.git
  panda3d_stubs_repo: https://github.com/WMOkiishi/types-panda3d.git
  direct_stubs_repo: https://git.scarlettbytes.nl/scarlett/direct-stubs.git

stages:
  - verify
  - package

.default-python-job-base: &default-python-job-base
  image: python:3.13
  cache:
    key: shared-pip-cache
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - pip config set global.cache-dir .cache/pip
    - pip install --upgrade pip --root-user-action=ignore
    - pip install -r requirements.txt --root-user-action=ignore
    - git clone --depth 1 $panda3d_stubs_repo stubs/panda3d
    - git clone --depth 1 $kivy_stubs_repo   stubs/kivy
    - git clone --depth 1 $direct_stubs_repo stubs/direct


.default-python-job: &default-python-job
  <<: *default-python-job-base
  only:
    - branches
    - merge_requests
  
pyright-full-check:
  <<: *default-python-job
  stage: verify
  allow_failure: true
  only:
    - merge_requests
  script:
    - pip install pyright --root-user-action=ignore
    - pyright . -p pyrightconfig.json

pyright-diff-check:
  <<: *default-python-job
  stage: verify
  except:
    - merge_requests
  script:
    - pip install pyright --root-user-action=ignore
    - git fetch origin $compare_branch
    - |
      changed_files=$(git diff --diff-filter=ACMR --name-only origin/$compare_branch...HEAD -- '*.py')
      if [ -n "$changed_files" ]; then
        echo "Changed Python files:"
        echo "$changed_files"
        pyright $changed_files -p pyrightconfig.json
      else
        echo "No Python files changed. Skipping pyright."
      fi

lint-check:
  <<: *default-python-job
  stage: verify
  script:
    - pip install ruff --root-user-action=ignore
    - ruff check .

format-check:
  <<: *default-python-job
  stage: verify
  script:
    - pip install ruff --root-user-action=ignore
    - ruff format --check --diff .

security-check:
  <<: *default-python-job
  stage: verify
  script:
    - pip install bandit --root-user-action=ignore
    - bandit -r . -c pyproject.toml

markdown-check:
  <<: *default-python-job
  stage: verify
  only:
    - branches
    - merge_requests
  script:
    - pymarkdownlnt --config .markdownlnt.json scan '**/*.md'

check-isdev-flag:
  <<: *default-python-job-base
  stage: verify
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^dev-.*$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  script:
    - scripts/check_isdev.py

package-linux:
  image: ubuntu:24.04          
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^dev-.*$/'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^dev-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
      when: manual
    - when: manual
  when: manual
  variables:
    DEBIAN_FRONTEND: noninteractive
    PYTHONUNBUFFERED: 1
  cache:
    key: shared-pip-cache
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends software-properties-common curl git build-essential python3-dev
    - add-apt-repository ppa:deadsnakes/ppa -y
    - apt-get update -qq
    - apt-get install -y --no-install-recommends python3.13 python3.13-dev
    - curl -sS https://bootstrap.pypa.io/get-pip.py | python3.13
    - update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.13 1
    - pip3 install --upgrade pip --root-user-action=ignore
    - pip3 install -r requirements.txt --root-user-action=ignore
  stage: package
  script:
    - python3 --version
    - ln -sf /usr/local/bin/python3.13 /usr/bin/python3
    - pip install briefcase --root-user-action=ignore
    - /usr/bin/python3.13 -m briefcase create linux
    - /usr/bin/python3.13 -m briefcase update -r
    - /usr/bin/python3.13 -m briefcase update
    - /usr/bin/python3.13 -m briefcase build linux
    - /usr/bin/python3.13 -m briefcase package linux
    - mkdir -p builds
    - cp dist/*.deb builds/
  artifacts:
    paths:
      - builds/*.deb
    expire_in: 1 week
